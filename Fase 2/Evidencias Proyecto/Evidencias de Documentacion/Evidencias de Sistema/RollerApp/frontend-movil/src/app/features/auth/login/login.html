<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Iniciar Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <img class="auth-brand-mark" src="rollerapp-r.svg" alt="RollerApp" width="56" height="56"><form [formGroup]="form" (ngSubmit)="enviar()">
    <ion-item>
      <ion-label position="stacked">Correo Electrónico</ion-label>
      <ion-input type="email" formControlName="correo" placeholder="tu@correo.cl"></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="stacked">Contraseña</ion-label>
      <ion-input type="password" formControlName="contrasena"></ion-input>
    </ion-item>

    <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="enviando">
      {{ enviando ? 'Ingresando...' : 'Ingresar' }}
    </ion-button>

    <ion-button expand="block" fill="clear" routerLink="/olvide-contrasena">
      ¿Olvidaste tu contraseña?
    </ion-button>

    <ion-button expand="block" fill="outline" routerLink="/registro">
      Crear Cuenta
    </ion-button>
  </form>
</ion-content>
