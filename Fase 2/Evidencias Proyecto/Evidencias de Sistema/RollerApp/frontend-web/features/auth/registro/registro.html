<div class="form-contenedor">
  <img class="auth-brand-mark" src="rollerapp-r.svg" alt="RollerApp" width="56" height="56"><h1>Crear Cuenta</h1>

  <form [formGroup]="form" (ngSubmit)="enviar()">
    <div class="form-item">
      <label for="nombre">Nombre</label>
      <input id="nombre" type="text" formControlName="nombre">
    </div>

    <div class="form-item">
      <label for="apellido">Apellido</label>
      <input id="apellido" type="text" formControlName="apellido">
    </div>

    <div class="form-item">
      <label for="correo">Correo Electrónico</label>
      <input id="correo" type="email" formControlName="correo" placeholder="tu@correo.cl">
      @if (form.controls.correo.invalid && form.controls.correo.touched) {
        <span class="form-error">Ingresa un correo válido.</span>
      }
    </div>

    <div class="form-item">
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" type="password" formControlName="contrasena">
      @if (form.controls.contrasena.invalid && form.controls.contrasena.touched) {
        <span class="form-error">Debe tener al menos 6 caracteres.</span>
      }
    </div>

    <button type="submit" class="btn" [disabled]="enviando">
      {{ enviando ? 'Creando cuenta...' : 'Crear Cuenta' }}
    </button>
  </form>

  <p class="form-nota">¿Ya tienes cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
</div>
